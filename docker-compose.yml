services:
  marketing-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satukelas-marketing-app
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-marketing_secret_pw}@marketing-db:5432/satukelas_marketing
      - APP_SECRET=${APP_SECRET:-satukelas-marketing-default-secret-change-me}
    depends_on:
      marketing-db:
        condition: service_healthy

  marketing-db:
    image: postgres:16-alpine
    container_name: satukelas-marketing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marketing_secret_pw}
      POSTGRES_DB: satukelas_marketing
    volumes:
      - marketing_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  marketing_pgdata:
