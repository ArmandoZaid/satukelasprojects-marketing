services:
  marketing-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the public HTTP or HTTPS origin}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in the runtime environment}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in the runtime environment}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the runtime environment}
      USE_SECURE_COOKIES: ${USE_SECURE_COOKIES:-true}
      MARKETING_ENABLE_DEMO_AUTH: ${MARKETING_ENABLE_DEMO_AUTH:-false}
      MARKETING_ENABLE_SYNTHETIC_CRM: ${MARKETING_ENABLE_SYNTHETIC_CRM:-false}
      MARKETING_ENABLE_ADMIN_PREVIEW: "false"
      MARKETING_USERS_JSON: ${MARKETING_USERS_JSON:-[]}
      PGHOST: ${PGHOST:-marketing-db}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-satukelas_marketing}
      PGUSER: ${PGUSER:-marketing}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the runtime environment}
      PGSSLMODE: ${PGSSLMODE:-disable}
    depends_on:
      marketing-db:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  marketing-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-marketing}
      POSTGRES_DB: ${PGDATABASE:-satukelas_marketing}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the runtime environment}
    volumes:
      - marketing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing -d satukelas_marketing"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  marketing_pgdata:
